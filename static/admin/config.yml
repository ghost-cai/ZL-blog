backend:
  name: github
  repo: ghost-cai/ZL-blog
  branch: main
  base_url: https://zlblog-oauth.1786726227.workers.dev
  auth_endpoint: auth

# 界面语言：简体中文（顶栏 Contents/Workflow/Media、按钮、提示等全部中文化）
locale: zh_Hans

# 发布模式：默认（简单直发）——后台点“保存/发布”直接提交到 main 并自动部署
# 之前用过 editorial_workflow（PR 审核流），国内网络下 API 调用多、易失败，已移除。

# 媒体文件存放位置（图片）
media_folder: static/images
public_folder: /images

collections:
  - name: posts
    label: 文章
    folder: content/posts
    create: true
    # 文件名格式：2026-10-25-my-title.md
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 日期, widget: datetime, default: "" }
      - { name: draft, label: 是否草稿, widget: boolean, default: false }
      - { name: tags, label: 标签, widget: list }
      - name: cover
        label: 封面图
        widget: object
        required: false
        fields:
          - { name: image, label: 图片, widget: image, required: false }
          - { name: alt, label: 替代文字, widget: string, required: false }
      - { name: body, label: 正文, widget: markdown }
