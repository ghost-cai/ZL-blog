backend:
  name: github
  repo: ghost-cai/ZL-blog
  branch: main
  # ↓↓↓ 把下面的 URL 换成你部署好的 Cloudflare Worker 地址（结尾不带斜杠）↓↓↓
  base_url: https://REPLACE-ME.workers.dev
  auth_endpoint: auth

# 发布模式：editorial_workflow 会先生成 PR，可审核后再发布（可选，也可删掉这行）
publish_mode: editorial_workflow

# 媒体文件存放位置（图片）
media_folder: static/images
public_folder: /images

collections:
  - name: posts
    label: 文章
    folder: content/posts
    create: true
    # 文件名格式：2026-10-25-my-title.md
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { name: title, label: 标题, widget: string }
      - { name: date, label: 日期, widget: datetime, default: "" }
      - { name: draft, label: 是否草稿, widget: boolean, default: false }
      - { name: tags, label: 标签, widget: list }
      - name: cover
        label: 封面图
        widget: object
        required: false
        fields:
          - { name: image, label: 图片, widget: image }
          - { name: alt, label: 替代文字, widget: string }
      - { name: body, label: 正文, widget: markdown }
