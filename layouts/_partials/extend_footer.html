{{/*
  注入到 </body> 前：阅读进度条（PaperMod 的 extend 扩展点）
  无需改动主题源码，Push 后即生效。
*/}}
<div id="reading-progress-bar"></div>
<script>
  (function () {
    var bar = document.getElementById('reading-progress-bar');
    if (!bar) return;
    function update() {
      var doc = document.documentElement;
      var scrollable = doc.scrollHeight - doc.clientHeight;
      var pct = scrollable > 0 ? (doc.scrollTop / scrollable) * 100 : 0;
      bar.style.width = pct + '%';
    }
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update, { passive: true });
    update();
  })();

  /* 顶栏主题切换：与 PaperMod 共用 localStorage["pref-theme"] + html[data-theme] */
  (function () {
    var btn = document.getElementById('topbar-theme-toggle');
    if (!btn) return;
    btn.addEventListener('click', function () {
      var cur = document.documentElement.getAttribute('data-theme');
      var next = (cur === 'dark') ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem('pref-theme', next); } catch (e) {}
    });
  })();

  /* 顶栏搜索框：从 /search/?q=xxx 进来时自动填入并执行搜索（等索引加载完） */
  (function () {
    var q = new URLSearchParams(location.search).get('q');
    if (!q) return;
    var tries = 0;
    (function fill() {
      var inp = document.getElementById('searchInput');
      if (inp && !inp.disabled) {
        inp.value = q;
        inp.dispatchEvent(new Event('input'));
      } else if (tries++ < 40) {
        setTimeout(fill, 250);
      }
    })();
  })();
  /* 页面跳转过渡（仿 Fuwari）：点击站内链接先淡出再跳转，新页面由 CSS 动画淡入 */
  (function () {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    function ok(a) {
      if (!a || a.hasAttribute('download') || a.target === '_blank') return false;
      var href = a.getAttribute('href') || '';
      if (!href || href.charAt(0) === '#') return false;               /* 页内锚点 */
      if (a.protocol && !/^https?:$/.test(a.protocol)) return false;   /* mailto/tel 等 */
      if (a.origin && a.origin !== location.origin) return false;      /* 外链 */
      if (/\/admin(\/|$)/.test(a.pathname || '')) return false;        /* Decap 后台 */
      if (a.pathname + a.search === location.pathname + location.search && a.hash) return false;
      return true;
    }
    document.addEventListener('click', function (e) {
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.defaultPrevented) return;
      var t = e.target;
      var a = t && t.closest ? t.closest('a') : null;
      if (!ok(a)) return;
      e.preventDefault();
      document.body.classList.add('page-leaving');
      setTimeout(function () { location.href = a.href; }, 170);
    }, true);
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) document.body.classList.remove('page-leaving'); /* bfcache 返回恢复 */
    });
  })();
  /* 顶栏搜索框：博客标题模糊搜索下拉（数据来自 index.json，懒加载一次） */
  (function () {
    var form = document.querySelector('.topbar-search');
    var input = form && form.querySelector('input[name="q"]');
    if (!form || !input) return;

    var posts = null, loading = false;
    var results = [], active = -1, box = null, timer = null;

    function openBox() {
      if (!box) {
        box = document.createElement('div');
        box.className = 'topbar-search-results';
        form.appendChild(box);
      }
      return box;
    }
    function closeBox() {
      if (box) { box.remove(); box = null; }
      results = []; active = -1;
    }
    function loadIndex(cb) {
      if (posts) return cb();
      if (loading) return;
      loading = true;
      fetch("{{ "index.json" | absLangURL }}")
        .then(function (r) { return r.json(); })
        .then(function (data) { posts = data || []; loading = false; cb(); })
        .catch(function () { loading = false; });
    }
    /* 模糊匹配：查询的每个字符按顺序出现在标题中即命中 */
    function fuzzy(q, text) {
      q = q.toLowerCase(); text = text.toLowerCase();
      var i = 0;
      for (var j = 0; j < text.length && i < q.length; j++) {
        if (text.charAt(j) === q.charAt(i)) i++;
      }
      return i === q.length;
    }
    function run(q) {
      results = posts.filter(function (p) { return p.title && fuzzy(q, p.title); }).slice(0, 8);
      active = -1;
      var b = openBox();
      b.innerHTML = '';
      if (!results.length) {
        b.innerHTML = '<div class="ts-empty">没有匹配的文章</div>';
        return;
      }
      results.forEach(function (p) {
        var a = document.createElement('a');
        a.href = p.permalink;
        a.textContent = p.title;
        a.addEventListener('mousedown', function (e) {
          e.preventDefault();          /* 抢在 blur 之前跳转 */
          location.href = p.permalink;
        });
        b.appendChild(a);
      });
    }
    input.addEventListener('input', function () {
      clearTimeout(timer);
      var q = input.value.trim();
      if (!q) { closeBox(); return; }
      timer = setTimeout(function () {
        if (posts) run(q);
        else loadIndex(function () { if (input.value.trim() === q) run(q); });
      }, 150);
    });
    input.addEventListener('keydown', function (e) {
      var items = box ? box.querySelectorAll('a') : [];
      if (e.key === 'ArrowDown' && items.length) {
        e.preventDefault();
        active = (active + 1) % items.length;
      } else if (e.key === 'ArrowUp' && items.length) {
        e.preventDefault();
        active = (active - 1 + items.length) % items.length;
      } else if (e.key === 'Enter') {
        if (active >= 0 && items[active]) {
          e.preventDefault();
          location.href = items[active].getAttribute('href');
        }
        return;                       /* 无选中项时走表单默认 → /search/?q= */
      } else if (e.key === 'Escape') {
        closeBox();
        return;
      } else {
        return;
      }
      items.forEach(function (el, i) { el.classList.toggle('active', i === active); });
    });
    document.addEventListener('click', function (e) {
      if (box && !form.contains(e.target)) closeBox();
    });
    input.addEventListener('search', function () { if (!input.value) closeBox(); });
  })();
</script>
