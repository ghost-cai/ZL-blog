baseURL = "https://ghost-cai.github.io/"
languageCode = "zh-cn"
title = "我的博客"
theme = "PaperMod"

summaryLength = 20
pagination = 5
enableGitInfo = false

[params]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

  [params.homeInfoParams]
    Title = "你好，欢迎来到我的博客"
    Content = "这里记录我的随笔、学习与思考。"

  [params.social]
    GitHub = "https://github.com/ghost-cai"
    Email = ""

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 1

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 2

