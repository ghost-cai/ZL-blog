baseURL = "https://ghost-cai.github.io/ZL-blog/"
languageCode = "zh-cn"
title = "我的博客"
theme = "PaperMod"

summaryLength = 20
enableGitInfo = false

# 搜索索引需要 home 输出 JSON（供 /search/ 页面使用）
[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 5
  path = "page"

[params]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  # 文章所在的内容目录（归档页、相关文章都依赖它）
  mainSections = ["posts"]
  # 评论区开关：存在 [params.comments.giscus] 表即为开启（内容由 layouts/_partials/comments.html 渲染）

  [params.homeInfoParams]
    Title = "你好，欢迎来到我的博客"
    Content = "这里记录我的随笔、学习与思考。"

  [params.social]
    GitHub = "https://github.com/ghost-cai"
    Email = ""

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 1

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 2

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 3

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 4

# 评论系统（Giscus）
# 启用步骤：
#   1. 仓库开启 Discussions（Settings → General → Features → Discussions 勾选）
#   2. 安装 Giscus App（https://github.com/apps/giscus）到本仓库
#   3. 到 https://giscus.app 生成参数，把 repoId / categoryId 填入下方
# 注意：repoId / categoryId 为空时不会渲染评论框（避免报错），填好即自动生效。
[params.comments.giscus]
  repo = "ghost-cai/ZL-blog"
  repoId = "1432302302"
  category = "Announcements"
  categoryId = "DIC_kwDOVV8y3s4DJhOB"
  mapping = "pathname"
  strict = false
  reactionsEnabled = true
  emitMetadata = false
  inputPosition = "bottom"
  lang = "zh-CN"
  loading = "lazy"
