baseURL = "https://ghost-cai.github.io/ZL-blog/"
locale = "zh-cn"
title = "我的博客"
theme = "PaperMod"

summaryLength = 20
enableGitInfo = false

# 搜索索引需要 home 输出 JSON（供 /search/ 页面使用）
[outputs]
  home = ["HTML", "RSS", "JSON"]

[pagination]
  pagerSize = 5
  path = "page"

[params]
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  # 文章所在的内容目录（归档页、相关文章都依赖它）
  mainSections = ["posts"]
  # 评论区开关：存在 [params.comments.giscus] 表即为开启（内容由 layouts/_partials/comments.html 渲染）

  # 首页封面图（放在 static/img/cover.jpg，可自行替换；留空则用渐变兜底）
  coverImage = "img/cover.jpg"

  # 左侧栏资料（头像放 static/img/avatar.jpg，可自行替换）
  [params.sidebar]
    avatar = "img/avatar.jpg"
    title = "你好，欢迎来到我的博客"
    subtitle = "这里记录我的随笔、学习与思考。"

  # 左侧栏社交图标（name 需为 PaperMod 内置图标名小写：github / email / rss / twitter 等）
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/ghost-cai"
    title = "GitHub"

[[menu.main]]
  identifier = "home"
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  identifier = "archives"
  name = "归档"
  url = "/archives/"
  weight = 2

[[menu.main]]
  identifier = "categories"
  name = "分类"
  url = "/categories/"
  weight = 3

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 4

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 5

# 评论系统（Giscus）
# 启用步骤：
#   1. 仓库开启 Discussions（Settings → General → Features → Discussions 勾选）
#   2. 安装 Giscus App（https://github.com/apps/giscus）到本仓库
#   3. 到 https://giscus.app 生成参数，把 repoId / categoryId 填入下方
# 注意：repoId / categoryId 为空时不会渲染评论框（避免报错），填好即自动生效。
[params.comments.giscus]
  repo = "ghost-cai/ZL-blog"
  repoId = "1432302302"
  category = "Announcements"
  categoryId = "DIC_kwDOVV8y3s4DJhOB"
  mapping = "pathname"
  strict = false
  reactionsEnabled = true
  emitMetadata = false
  inputPosition = "bottom"
  lang = "zh-CN"
  loading = "lazy"
